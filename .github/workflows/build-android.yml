name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Check for google-services.json
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "❌ ERREUR : google-services.json est manquant dans android/app/"
            echo "Veuillez le placer à la racine de votre projet ou dans android/app/"
            # Tentative de récupération si placé à la racine par l'utilisateur
            if [ -f "google-services.json" ]; then
              cp google-services.json android/app/google-services.json
              echo "✅ google-services.json trouvé à la racine et copié."
            else
              exit 1
            fi
          else
            echo "✅ google-services.json est présent."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Project (Permissions & Package Name)
        run: |
          # Inject Custom AndroidManifest.xml
          if [ -f "mobile/android/AndroidManifest.xml" ]; then
            cp mobile/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml personnalisé appliqué."
          fi
          
          # Inject Network Security Config
          mkdir -p android/app/src/main/res/xml
          if [ -f "mobile/android/network_security_config.xml" ]; then
            cp mobile/android/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
            echo "✅ network_security_config.xml appliqué."
          fi
          
          # Update Application ID in build.gradle
          sed -i 's/applicationId ".*"/applicationId "tg.logonova.cpla1erd"/' android/app/build.gradle

      - name: Inject Signing Config into build.gradle
        run: |
          # Create signing config block
          cat <<EOF > signing.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          # Append signing config to build.gradle
          cat signing.gradle >> android/app/build.gradle

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Display SHA-1 fingerprint
        run: |
          echo "=== SHA-1 Fingerprint ==="
          if [ -f "android/app/release-key.keystore" ]; then
            keytool -list -v -keystore android/app/release-key.keystore -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.KEYSTORE_PASSWORD }} | grep SHA1
          else
            echo "Release keystore not found, checking debug keystore..."
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep SHA1
          fi
          echo "========================="

      - name: Build APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Debug Output (if failed)
        if: failure()
        run: |
          ls -R android/app/src/main
          cat android/app/build.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
